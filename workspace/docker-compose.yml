services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: cafe_flow_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      - db
      - redis
      - wa-gateway
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/cafe_flow_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_for_dev
      - WHATSAPP_GATEWAY_URL=http://wa-gateway:3002
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  wa-gateway:
    build: ./wa-gateway
    container_name: cafe-flow-wa-gateway
    restart: unless-stopped
    environment:
      - PORT=3002
      - SESSIONS_DIR=/app/sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wa_sessions:/app/sessions
    ports:
      - "3002:3002"

volumes:
  postgres_data:
  wa_sessions: